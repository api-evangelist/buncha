aid: buncha
name: Buncha
description: 'Buncha is a scheduled neighborhood grocery delivery service operating
  across Minnesota and Michigan. Customers shop online from local partner retailers
  and receive their orders on set weekly routes, with a single refrigerated van consolidating
  multiple neighbors'' orders into one trip for a $3.45 flat delivery fee. Professional
  personal shoppers hand-pick items into insulated bags, and the aggregated-route
  model is positioned to cut delivery CO2 emissions by up to 80% versus on-demand
  services. Buncha is offered through iOS and Android consumer apps and is backed by
  Foundry Group and Techstars. It is currently a consumer product with no public developer
  API surface.'
